# Servidor
server.port=8082

# Nombre (como aparece en Eureka)
spring.application.name=MS-SEGURIDAD

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_seguridad?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway ? apunta a db.migration (con punto, no slash, asi esta la carpeta)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db.migration

# JWT: usar el mismo secreto fuerte de al menos 32 bytes que el gateway.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
refresh-token.expiration=604800000
refresh-token.cookie-name=gmoon_refresh
refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:false}
refresh-token.cookie-same-site=Strict

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Logging
logging.level.org.springframework.security=INFO
# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
