spring.application.name=ms-gateway
server.port=5050

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Spring Cloud Gateway - integracion con Eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# =========================================================
# RUTAS DEL GATEWAY
# =========================================================

# /auth/** -> MS-SEGURIDAD
spring.cloud.gateway.server.webflux.routes[0].id=ms-seguridad
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS-SEGURIDAD
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtAuthFilter

# /api/v1/usuarios/** -> MS-USUARIOS
spring.cloud.gateway.server.webflux.routes[1].id=ms-usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MS-USUARIOS
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter

# Rutas versionadas para el frontend Gmoon.
# Los productos y categorías internos todavía usan /api/v2; RewritePath mantiene
# el contrato público /api/v1 mientras se adapta MS-productos.
spring.cloud.gateway.server.webflux.routes[2].id=ms-productos-v1
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MS-PRODUCTOS
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/productos,/api/v1/productos/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[2].filters[1]=RewritePath=/api/v1/productos(?<segment>/?.*),/api/v2/productos$\{segment}

spring.cloud.gateway.server.webflux.routes[3].id=ms-categorias-v1
spring.cloud.gateway.server.webflux.routes[3].uri=lb://MS-PRODUCTOS
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/categorias,/api/v1/categorias/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[3].filters[1]=RewritePath=/api/v1/categorias(?<segment>/?.*),/api/v2/categorias$\{segment}

# Compatibilidad temporal para consumidores del contrato antiguo del catálogo.
spring.cloud.gateway.server.webflux.routes[4].id=ms-productos-legacy
spring.cloud.gateway.server.webflux.routes[4].uri=lb://MS-PRODUCTOS
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v2/productos,/api/v2/productos/**,/api/v2/categorias,/api/v2/categorias/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=JwtAuthFilter

# Pedidos se mantiene temporalmente y boletas queda como contrato para la adaptación de MS-pedidos.
spring.cloud.gateway.server.webflux.routes[5].id=ms-pedidos-legacy
spring.cloud.gateway.server.webflux.routes[5].uri=lb://MS-PEDIDOS
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/pedidos,/api/v1/pedidos/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=JwtAuthFilter

spring.cloud.gateway.server.webflux.routes[6].id=ms-boletas-v1
spring.cloud.gateway.server.webflux.routes[6].uri=lb://MS-PEDIDOS
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/boletas,/api/v1/boletas/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=JwtAuthFilter

# =========================================================
# RUTAS SWAGGER (acceso publico a docs)
# =========================================================

spring.cloud.gateway.server.webflux.routes[7].id=swagger-seguridad
spring.cloud.gateway.server.webflux.routes[7].uri=lb://MS-SEGURIDAD
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/docs/seguridad/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/docs/seguridad/(?<segment>.*),/$\{segment}

spring.cloud.gateway.server.webflux.routes[8].id=swagger-usuarios
spring.cloud.gateway.server.webflux.routes[8].uri=lb://MS-USUARIOS
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/docs/usuarios/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/docs/usuarios/(?<segment>.*),/$\{segment}

spring.cloud.gateway.server.webflux.routes[9].id=swagger-productos
spring.cloud.gateway.server.webflux.routes[9].uri=lb://MS-PRODUCTOS
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/docs/productos/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/docs/productos/(?<segment>.*),/$\{segment}

spring.cloud.gateway.server.webflux.routes[10].id=swagger-pedidos
spring.cloud.gateway.server.webflux.routes[10].uri=lb://MS-PEDIDOS
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/docs/pedidos/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=RewritePath=/docs/pedidos/(?<segment>.*),/$\{segment}

# CORS para el frontend React local
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.MS_gateway=DEBUG
jwt.secret=${JWT_SECRET}